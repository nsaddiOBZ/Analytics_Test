name: Analytics Portal

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production

concurrency:
  group: analytics-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build analytics-portal-pages artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p dist/site
          cp Obzervr_Analytics_Portal_Live3.html dist/site/index.html
          if [ -d configuration ]; then
            cp -r configuration dist/configuration
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: analytics-portal-pages
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    uses: ./.github/workflows/deploy-cloudflare-pages-artifact.yml
    with:
      application-name: Analytics-Portal
      environment: ${{ inputs.environment || 'production' }}
      cloudflare-project-name: obzervr-analytics-portal
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
